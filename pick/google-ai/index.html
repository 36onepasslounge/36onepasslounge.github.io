
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>졸특 PICK | 구글 청년 AI 역량강화 프로그램</title>
  <meta name="theme-color" content="#081226">

  <!-- 카카오톡 미리보기 -->
  <meta property="og:type" content="website">
  <meta property="og:title"
        content="졸특 PICK | 구글 청년 AI 역량강화 프로그램">
  <meta property="og:description"
        content="Google AI Professional Certificate · 구글 공식 AI 수료증 발급! 알아보기와 신청하기를 한 번에.">
  <meta property="og:url"
        content="https://36onepasslounge.github.io/pick/google-ai/">
  <meta property="og:image"
        content="https://36onepasslounge.github.io/pick/google-ai/thumb-google-ai.png">
  <meta property="og:image:secure_url"
        content="https://36onepasslounge.github.io/pick/google-ai/thumb-google-ai.png">
  <meta property="og:image:type" content="image/png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image"
        content="https://36onepasslounge.github.io/pick/google-ai/thumb-google-ai.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #081226;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    /* 포스터 한 장만 표시 */
    .poster {
      position: relative;
      width: min(100%, 620px);
      margin: 0 auto;
      line-height: 0;
    }

    .poster img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 이미지 안 실제 버튼 위에 놓는 투명 링크 */
    .hotspot {
      position: absolute;
      display: block;
      z-index: 2;
      border-radius: 999px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /*
      기존 세로 포스터 기준
      왼쪽 아래 '알아보기' 버튼
    */
    .learn {
      left: 3.5%;
      top: 88.4%;
      width: 45.5%;
      height: 5.3%;
    }

    /*
      오른쪽 아래 '바로 신청하기' 버튼
    */
    .apply {
      left: 50%;
      top: 88.4%;
      width: 45.5%;
      height: 5.3%;
    }

    /* 키보드 접근성 및 클릭 위치 확인 */
    .hotspot:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: -3px;
    }

    .hotspot:active {
      background: rgba(255,255,255,.12);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

<body>

  <main class="poster">

    <!-- 실제 웹페이지 포스터 -->
    <img
      src="./hero-google-ai.png"
      alt="졸특 PICK 구글 청년 AI 역량강화 프로그램. 하단에 알아보기와 바로 신청하기 버튼이 있습니다."
      width="941"
      height="1672"
    >

    <!-- 이미지 속 왼쪽 알아보기 버튼 -->
    <a
      class="hotspot learn"
      href="https://buly.kr/28vfX8u"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="구글 AI 프로그램 알아보기"
    >
      <span class="sr-only">알아보기</span>
    </a>

    <!-- 이미지 속 오른쪽 바로 신청하기 버튼 -->
    <a
      class="hotspot apply"
      href="https://forms.gle/7DCHPWhnjvYZTbtPA"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="구글 AI 프로그램 바로 신청하기"
    >
      <span class="sr-only">바로 신청하기</span>
    </a>

  </main>

</body>
</html>
