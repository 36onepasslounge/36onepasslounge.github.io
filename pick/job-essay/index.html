<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;

    /* 기존 파랑 → 따뜻한 라벤더/크림 */
    background:
      radial-gradient(circle at 15% 0%,
        #ffe8e2 0%,
        transparent 32%),
      radial-gradient(circle at 90% 10%,
        #e7dcff 0%,
        transparent 35%),
      linear-gradient(
        180deg,
        #fffaf6 0%,
        #f7efff 55%,
        #fff3ee 100%
      );

    font-family:
      "Apple SD Gothic Neo",
      "Malgun Gothic",
      Arial,
      sans-serif;
  }

  .page {
    width: min(100%, 620px);
    margin: 0 auto;
    padding: 14px 10px 32px;
  }


  /* 포스터 */

  .poster {
    overflow: hidden;
    border-radius: 22px;
    background: #ffffff;

    border: 2px solid #eadcff;

    box-shadow:
      0 14px 32px rgba(113, 73, 148, .15);
  }

  .poster img {
    display: block;
    width: 100%;
    height: auto;
  }


  /* 버튼 */

  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 13px;
  }

  .btn {
    min-height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 12px 10px;

    border-radius: 17px;

    text-align: center;
    text-decoration: none;

    font-size: 15px;
    font-weight: 900;

    word-break: keep-all;

    transition:
      transform .15s ease,
      box-shadow .15s ease;
  }

  .btn:active {
    transform: scale(.98);
  }


  /* 바로 신청하기
     노란색 → 코랄 */

  .apply {
    background:
      linear-gradient(
        135deg,
        #ff806f,
        #ffad87
      );

    color: #ffffff;

    box-shadow:
      0 8px 18px rgba(255, 114, 96, .24);
  }


  /* 홈페이지 안내
     파랑 → 라벤더 */

  .home {
    background:
      linear-gradient(
        135deg,
        #7355c7,
        #9c7bea
      );

    color: #ffffff;

    box-shadow:
      0 8px 18px rgba(116, 84, 199, .22);
  }


  /* 안내문 */

  .note {
    margin: 14px 4px 0;

    padding: 12px 14px;

    background: rgba(255,255,255,.72);

    border: 1px solid #eadcf6;

    border-radius: 14px;

    color: #705f76;

    font-size: 12px;
    line-height: 1.65;

    text-align: center;
  }


  @media (max-width: 360px) {

    .btn {
      font-size: 13px;
      padding: 9px 6px;
    }

  }
</style>
