  <!-- 카카오톡 / 채널톡 미리보기 -->

  <meta property="og:type" content="website">

  <meta

  >

  <meta
    property="og:url"
    content="https://36onepasslounge.github.io/pick/dragon-nest/"
  >

  <meta
    property="og:image"
    content="https://36onepasslounge.github.io/pick/dragon-nest/dragon-nest-preview-v2.png"
  >

  <meta
    property="og:image:secure_url"
    content="https://36onepasslounge.github.io/pick/dragon-nest/dragon-nest-preview-v2.png"
  >

  <meta property="og:image:type" content="image/png">

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:image"
    content="https://36onepasslounge.github.io/pick/dragon-nest/dragon-nest-preview-v2.png"
  >


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      background:
        linear-gradient(
          180deg,
          #fff6ec 0%,
          #fffdf9 100%
        );

      font-family:
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        Arial,
        sans-serif;
    }


    .wrap {
      width: min(100%, 900px);

      margin: 0 auto;

      padding:
        12px
        10px
        30px;
    }


    /* 포스터 */

    .poster-wrap {
      position: relative;

      width: 100%;

      overflow: hidden;

      border-radius: 22px;

      background: #ffffff;

      box-shadow:
        0 14px 32px rgba(60, 42, 26, .15);
    }


    .poster-wrap img {
      display: block;

      width: 100%;
      height: auto;
    }


    /*
      포스터 속
      '지금 바로 신청하기!' 버튼만 클릭 가능
    */

    .apply-hotspot {
      position: absolute;

      left: 66%;
      top: 59%;

      width: 31%;
      height: 18%;

      display: block;

      border-radius: 40px;

      background: transparent;

      cursor: pointer;

      -webkit-tap-highlight-color:
        rgba(255,255,255,.16);
    }


    .apply-hotspot:active {
      background:
        rgba(255,255,255,.10);
    }


    footer {
      padding:
        17px
        5px
        0;

      text-align: center;

      color: #887a6d;

      font-size: 11px;
      line-height: 1.6;
    }

  </style>
</head>


<body>

<main class="wrap">


  <section class="poster-wrap">


    <img
      src="./dragon-nest-preview-v2.png"
      alt="아이덴티티게임즈 드래곤네스트 신규 게임 출시 프로젝트"
    >


    <!--
      포스터 안의
      '지금 바로 신청하기!' 위치만 클릭됨
    -->

    <a
      class="apply-hotspot"
      href="https://yw.work24.go.kr/d/a/selectItrnPrjtEsgPrgmDtal.do"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="드래곤네스트 프로젝트 지금 바로 신청하기"
    ></a>


  </section>


  <footer>
    삼육대학교 대학일자리본부 · 졸특 PICK
  </footer>


</main>

</body>
</html>
