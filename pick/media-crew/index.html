  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100svh;
      padding: 8px;

      font-family:
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #28314f;

      background:
        radial-gradient(circle at 8% 10%, #dbeaff 0, transparent 23%),
        radial-gradient(circle at 92% 12%, #fff2c9 0, transparent 24%),
        radial-gradient(circle at 10% 90%, #ddf5ea 0, transparent 21%),
        radial-gradient(circle at 92% 90%, #eee4ff 0, transparent 22%),
        #faf8ff;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrap {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: rgba(255,255,255,.95);

      border: 1px solid #ebe6f7;
      border-radius: 24px;

      padding: 14px;

      box-shadow:
        0 12px 28px rgba(110, 90, 160, .12);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 8px;

      margin-bottom: 7px;
    }

    .pick {
      padding: 7px 12px;

      background: #8e6de5;
      color: #fff;

      border-radius: 999px;

      font-size: 14px;
      font-weight: 900;
    }

    .deadline {
      padding: 6px 9px;

      background: #f2ecff;
      color: #7057c7;

      border-radius: 999px;

      font-size: 11px;
      font-weight: 850;
    }

    .school {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 7px;

      margin-bottom: 8px;

      color: #7a8298;

      font-size: 10px;
      font-weight: 800;
    }

    .school::before,
    .school::after {
      content: "";

      width: 28px;
      height: 1px;

      background: #d6d9e8;
    }

    .experience {
      margin-bottom: 3px;

      color: #8e6de5;

      font-size: 16px;
      font-weight: 950;

      letter-spacing: -0.03em;
    }

    h1 {
      margin: 0;

      font-size: 29px;
      line-height: 1.02;

      letter-spacing: -0.055em;

      font-weight: 950;
    }

    .purple {
      color: #8e6de5;
    }

    .blue {
      color: #67aef5;
    }

    .navy {
      color: #31436c;
    }

    .desc {
      margin: 7px 0 8px;

      color: #505b79;

      font-size: 13px;
      line-height: 1.35;

      font-weight: 700;
    }

    .project-pill {
      margin-bottom: 8px;

      padding: 8px 9px;

      text-align: center;

      background: #eee7ff;

      border-radius: 999px;

      color: #4d4772;

      font-size: 11px;
      font-weight: 900;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(2, 1fr);

      gap: 6px;

      margin-bottom: 7px;
    }

    .fact {
      min-height: 69px;

      padding: 9px 10px;

      border-radius: 15px;
    }

    .fact1 {
      background: #ffecef;
    }

    .fact2 {
      background: #e5f1ff;
    }

    .fact3 {
      background: #e4f6ee;
    }

    .fact4 {
      background: #fff4c9;
    }

    .label {
      display: block;

      margin-bottom: 3px;

      color: #6c7691;

      font-size: 10px;
      font-weight: 900;
    }

    .value {
      display: block;

      font-size: 14px;
      line-height: 1.15;

      font-weight: 950;

      letter-spacing: -0.03em;
    }

    .benefits {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;

      gap: 4px;

      margin-bottom: 6px;
    }

    .benefits span {
      padding: 5px 7px;

      border-radius: 999px;

      background: #f5f5fb;

      border: 1px solid #e7e7f2;

      color: #5b6580;

      font-size: 9px;
      font-weight: 850;
    }

    .mascots {
      display: flex;
      align-items: flex-end;
      justify-content: center;

      gap: 2px;

      margin: 0 0 5px;
    }

    .mascots img {
      object-fit: contain;

      filter:
        drop-shadow(
          0 5px 6px rgba(110, 100, 150, .08)
        );
    }

    .suho {
      width: 78px;
    }

    .suya {
      width: 68px;
    }

    .cta {
      width: 100%;
      min-height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 7px;

      text-decoration: none;

      background:
        linear-gradient(
          135deg,
          #8e6de5,
          #ae8df2
        );

      color: #fff;

      border-radius: 999px;

      font-size: 17px;
      font-weight: 950;

      letter-spacing: -0.04em;

      box-shadow:
        0 8px 16px rgba(142, 109, 229, .22);
    }

    .arrow {
      font-size: 22px;
      line-height: 1;
    }

    .footer {
      margin-top: 6px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 5px;

      color: #858da4;

      font-size: 8px;
      font-weight: 700;
    }

    .footer img {
      width: 16px;
      height: 16px;

      object-fit: contain;
    }

    @media (max-height: 720px) {
      .mascots {
        display: none;
      }

      .card {
        padding: 11px;
      }

      h1 {
        font-size: 27px;
      }

      .fact {
        min-height: 62px;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <main class="card">

    <div class="top">

    <div class="mascots">

    </div>


    <!-- 실제로 열리는 삼육대 공식 공고 주소 -->
    <a

      target="_blank"

    >
      알아보기
      <span class="arrow">›</span>
    </a>


    <div class="footer">

      <img
        src="/syu-logo.png"
        alt="삼육대학교"
      >

      삼육대학교 대학일자리본부 · 졸특 안내

    </div>

  </main>

</div>
