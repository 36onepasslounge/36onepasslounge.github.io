  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 24px 16px;

      font-family:
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #28314f;

      background:
        radial-gradient(circle at 8% 10%, #dbeaff 0, transparent 23%),
        radial-gradient(circle at 92% 12%, #fff2c9 0, transparent 24%),
        radial-gradient(circle at 10% 90%, #ddf5ea 0, transparent 21%),
        radial-gradient(circle at 92% 90%, #eee4ff 0, transparent 22%),
        #faf8ff;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wrap {
      width: 100%;
      max-width: 500px;
    }

    .card {
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #ebe6f7;
      border-radius: 32px;
      padding: 24px 20px 20px;
      box-shadow: 0 20px 45px rgba(110, 90, 160, 0.13);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }

    .pick {
      display: inline-flex;
      align-items: center;
      padding: 10px 18px;
      background: #8e6de5;
      color: #ffffff;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .deadline {
      padding: 9px 13px;
      background: #f2ecff;
      color: #7057c7;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
    }

    .school {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 17px;
      font-size: 12px;
      font-weight: 800;
      color: #76809c;
    }

    .school::before,
    .school::after {
      content: "";
      width: 42px;
      height: 1px;
      background: #d6d9e8;
    }

    .experience {
      display: inline-block;
      margin-bottom: 7px;
      color: #8e6de5;
      font-size: 21px;
      font-weight: 950;
      letter-spacing: -0.03em;
    }

    h1 {
      margin: 0;
      font-size: 39px;
      line-height: 1.08;
      letter-spacing: -0.055em;
      font-weight: 950;
    }

    .purple {
      color: #8e6de5;
    }

    .blue {
      color: #67aef5;
    }

    .navy {
      color: #31436c;
    }

    .desc {
      margin: 14px 0 16px;
      font-size: 16px;
      line-height: 1.55;
      font-weight: 700;
      color: #505b79;
    }

    .project-pill {
      margin-bottom: 18px;
      padding: 13px 14px;
      text-align: center;
      background: #eee7ff;
      border-radius: 999px;
      color: #4d4772;
      font-size: 15px;
      font-weight: 900;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .fact {
      min-height: 118px;
      padding: 16px 14px;
      border-radius: 22px;
    }

    .fact1 {
      background: #ffecef;
    }

    .fact2 {
      background: #e5f1ff;
    }

    .fact3 {
      background: #e4f6ee;
    }

    .fact4 {
      background: #fff4c9;
    }

    .label {
      display: block;
      margin-bottom: 7px;
      color: #6c7691;
      font-size: 13px;
      font-weight: 900;
    }

    .value {
      display: block;
      font-size: 19px;
      line-height: 1.3;
      font-weight: 950;
      letter-spacing: -0.03em;
    }

    .benefits {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      margin: 2px 0 17px;
    }

    .benefits span {
      padding: 8px 11px;
      border-radius: 999px;
      background: #f5f5fb;
      border: 1px solid #e7e7f2;
      color: #5b6580;
      font-size: 12px;
      font-weight: 850;
    }

    .mascots {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      margin: 6px 0 10px;
    }

    .mascots img {
      object-fit: contain;
      filter: drop-shadow(0 8px 8px rgba(110, 100, 150, 0.08));
    }

    .suho {
      width: 145px;
    }

    .suya {
      width: 125px;
    }

    .cta {
      width: 100%;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      background: linear-gradient(135deg, #8e6de5, #ae8df2);
      color: #ffffff;
      border-radius: 999px;
      font-size: 25px;
      font-weight: 950;
      letter-spacing: -0.04em;
      box-shadow: 0 12px 24px rgba(142, 109, 229, 0.24);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(142, 109, 229, 0.28);
    }

    .arrow {
      font-size: 30px;
      line-height: 1;
    }

    .footer {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      color: #858da4;
      font-size: 11px;
      font-weight: 700;
    }

    .footer img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

      }

      .value {

      }

      .suho {

      }

      .suya {
        width: 108px;
      }

      .cta {
        min-height: 59px;
        font-size: 23px;
      }
