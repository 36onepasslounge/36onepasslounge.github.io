<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NCS 취업준비 과정</title>

  <!-- 카카오톡 / SNS 미리보기 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="졸특 PICK | NCS 취업준비 과정" />
  <meta property="og:description" content="11/2~11/5 · 18:00~21:00 예정 · NCS 진단검사부터 기업 준비전략·모의시험까지" />
  <meta property="og:url" content="https://36onepasslounge.github.io/pick/ncs/" />
  <meta property="og:image" content="https://36onepasslounge.github.io/pick/ncs/og-ncs.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #f7f5ff 0%, #ffffff 100%);
      font-family: Pretendard, "Noto Sans KR", Arial, sans-serif;
      color: #111827;
    }

    .wrap {
      width: min(560px, 100%);
      margin: 0 auto;
      padding: 18px 16px 40px;
    }

    .poster {
      width: 100%;
      display: block;
      border-radius: 24px;
      box-shadow: 0 14px 36px rgba(82, 66, 220, 0.14);
      margin-bottom: 20px;
    }

    .survey-box {
      background: #ffffff;
      border-radius: 24px;
      padding: 22px 18px;
      box-shadow: 0 12px 30px rgba(17,24,39,.08);
    }

    .question {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 15px;
      text-align: center;
      color: #1e1b4b;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 18px 14px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: default;
    }

    .yes {
      background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
      color: #ffffff;
      box-shadow: 0 10px 24px rgba(124, 58, 237, 0.22);
    }

    .no {
      background: #f4f1ff;
      color: #1f2937;
      border: 1px solid #e3ddff;
    }

    .reason-box {
      display: none;
      margin-top: 14px;
      padding: 15px;
      background: #faf9ff;
      border-radius: 16px;
      border: 1px solid #ece8ff;
    }

    .reason-title {
      font-size: 15px;
      font-weight: 900;
      color: #5b4df2;
      margin-bottom: 10px;
    }

    .reason-buttons {
      display: grid;
      gap: 8px;
    }

    .reason-buttons button {
      background: #ffffff;
      color: #111827;
      border: 1px solid #e5e7eb;
      font-size: 14px;
      text-align: left;
      padding: 13px;
    }

    .notice {
      margin-top: 18px;
      font-size: 13px;
      line-height: 1.6;
      color: #6b21a8;
      background: #f8f5ff;
      border-radius: 14px;
      padding: 13px;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 15px;
      font-weight: 900;
      color: #5b4df2;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- 실제 페이지 안에 보여줄 세로형 포스터 -->
    <img
      src="ncs-detail.png"
      alt="NCS 취업준비 과정 안내"
      class="poster"
    />

    <div class="survey-box">
      <div class="question">
        참여 가능 여부를 알려주세요!
      </div>

      <div class="buttons">
        <form
          id="yesForm"
          action="https://script.google.com/macros/s/AKfycbyc3EoRU_u1rxLSyFYeUYXHbks2y-hDP5YPyRPkTeC2DFZGAFjV5OVudG4euwcjXb8/exec"
          method="POST"
          target="hiddenFrame"
        >
          <input type="hidden" name="answer" value="참여하고 싶어요">
          <input type="hidden" name="reason" value="">
          <button class="yes" type="submit">🙋 참여할래요</button>
        </form>

        <button class="no" id="noButton" type="button">🙅 참여가 어려워요</button>
      </div>

      <div class="reason-box" id="reasonBox">
        <div class="reason-title">참여가 어려운 이유를 알려주세요.</div>

        <div class="reason-buttons">
          <button type="button" data-reason="일정이 맞지 않아요">📅 일정이 맞지 않아요</button>
          <button type="button" data-reason="시간이 맞지 않아요">🕕 시간이 맞지 않아요</button>
          <button type="button" data-reason="NCS 과정이 필요하지 않아요">📚 NCS 과정이 필요하지 않아요</button>
          <button type="button" data-reason="다른 일정 또는 취업 준비가 있어요">💼 다른 일정 또는 취업 준비가 있어요</button>
          <button type="button" data-reason="기타">✏️ 기타</button>
        </div>
      </div>

      <form
        id="noForm"
        action="https://script.google.com/macros/s/AKfycbyc3EoRU_u1rxLSyFYeUYXHbks2y-hDP5YPyRPkTeC2DFZGAFjV5OVudG4euwcjXb8/exec"
        method="POST"
        target="hiddenFrame"
        style="display:none;"
      >
        <input type="hidden" name="answer" value="참여가 어려워요">
        <input type="hidden" name="reason" id="reasonInput" value="">
      </form>

      <div class="notice">
        ※ 본 일정은 가계획이며, 참여 희망 결과에 따라 일정 및 운영시간은 조정될 수 있습니다.
      </div>

      <div id="message"></div>

      <iframe name="hiddenFrame" style="display:none;"></iframe>
    </div>
  </div>

  <script>
    const yesForm = document.getElementById("yesForm");
    const noForm = document.getElementById("noForm");
    const noButton = document.getElementById("noButton");
    const reasonBox = document.getElementById("reasonBox");
    const reasonInput = document.getElementById("reasonInput");
    const message = document.getElementById("message");
    const allButtons = document.querySelectorAll("button");

    function finishVote() {
      localStorage.setItem("ncsSurvey2026", "done");
      allButtons.forEach(btn => {
        btn.disabled = true;
      });
      reasonBox.style.display = "none";
      message.textContent = "응답 완료! 감사합니다 🙌";
    }

    if (localStorage.getItem("ncsSurvey2026")) {
      allButtons.forEach(btn => {
        btn.disabled = true;
      });
      message.textContent = "이미 응답했어요. 감사합니다!";
    }

    yesForm.addEventListener("submit", () => {
      finishVote();
    });

    noButton.addEventListener("click", () => {
      reasonBox.style.display = "block";
    });

    document.querySelectorAll("[data-reason]").forEach(btn => {
      btn.addEventListener("click", () => {
        reasonInput.value = btn.dataset.reason;
        noForm.submit();
        finishVote();
      });
    });
  </script>
</body>
</html>
