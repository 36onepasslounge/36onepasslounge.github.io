<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NCS 취업준비 과정</title>

  <!-- 카카오톡 / SNS 미리보기 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="NCS 취업준비 과정, 참여하시겠어요?">
  <meta
    property="og:description"
    content="11/2~11/5 · 18:00~21:00 예정 · NCS 진단검사부터 기업 준비전략·모의시험까지"
  >
  <meta
    property="og:url"
    content="https://36onepasslounge.github.io/pick/ncs/"
  >
  <meta
    property="og:image"
    content="https://36onepasslounge.github.io/pick/ncs/og-ncs.png"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #f7f5ff 0%, #ffffff 100%);
      font-family: Pretendard, "Noto Sans KR", Arial, sans-serif;
      color: #111827;
    }

    .wrap {
      width: min(560px, 100%);
      margin: 0 auto;
      padding: 14px 12px 40px;
    }

    /* 포스터 전체 */
    .poster-wrap {
      position: relative;
      width: 100%;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 14px 36px rgba(82, 66, 220, 0.14);
      background: #ffffff;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
    }

    /*
      이미지 속 버튼 위에 얹는 실제 클릭 영역
      화면에는 보이지 않음
    */
    .hotspot {
      position: absolute;
      left: 6.3%;
      width: 87.4%;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      cursor: pointer;
      z-index: 10;
      border-radius: 18px;
      -webkit-tap-highlight-color: rgba(124, 58, 237, 0.15);
    }

    /* 현재 ncs-detail.png 기준 위치 */
    .hotspot-yes {
      top: 68.9%;
      height: 7.3%;
    }

    .hotspot-no {
      top: 77.0%;
      height: 7.1%;
    }

    .hotspot:focus-visible {
      outline: 3px solid #7c3aed;
      outline-offset: -3px;
    }

    /* 불참 사유 박스 */
    .reason-box {
      display: none;
      margin-top: 16px;
      padding: 18px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 28px rgba(17, 24, 39, 0.08);
    }

    .reason-title {
      font-size: 17px;
      font-weight: 900;
      color: #312e81;
      text-align: center;
      margin-bottom: 14px;
    }

    .reason-buttons {
      display: grid;
      gap: 9px;
    }

    .reason-buttons button {
      width: 100%;
      padding: 14px 13px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      background: #ffffff;
      color: #111827;
      font-size: 15px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }

    .reason-buttons button:active {
      background: #f5f3ff;
    }

    /* 기타 입력 영역 */
    .other-box {
      display: none;
      margin-top: 12px;
    }

    .other-box textarea {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      padding: 13px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      outline: none;
    }

    .other-box textarea:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
    }

    .other-submit {
      margin-top: 10px;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .other-submit:active {
      transform: scale(.99);
    }

    /* 완료 메시지 */
    #message {
      display: none;
      margin-top: 16px;
      padding: 17px;
      border-radius: 18px;
      background: #f5f3ff;
      color: #5b21b6;
      text-align: center;
      font-size: 16px;
      font-weight: 900;
    }

    .submitted .hotspot {
      pointer-events: none;
    }

    .submitted .reason-box {
      display: none !important;
    }
  </style>
</head>

<body>

  <main class="wrap" id="page">

    <!-- 포스터 + 이미지 속 클릭 영역 -->
    <div class="poster-wrap">

      <img
        src="ncs-detail.png"
        alt="NCS 취업준비 과정 안내"
        class="poster"
      >

      <!-- 이미지 속 '참여할래요' -->
      <button
        type="button"
        class="hotspot hotspot-yes"
        id="yesButton"
        aria-label="참여할래요"
      ></button>

      <!-- 이미지 속 '참여가 어려워요' -->
      <button
        type="button"
        class="hotspot hotspot-no"
        id="noButton"
        aria-label="참여가 어려워요"
      ></button>

    </div>


    <!-- 불참 사유 -->
    <section class="reason-box" id="reasonBox">

      <div class="reason-title">
        참여가 어려운 이유를 알려주세요.
      </div>

      <div class="reason-buttons">

        <button
          type="button"
          data-reason="일정이 맞지 않아요"
        >
          📅 일정이 맞지 않아요
        </button>

        <button
          type="button"
          data-reason="시간이 맞지 않아요"
        >
          🕕 시간이 맞지 않아요
        </button>

        <button
          type="button"
          data-reason="NCS 과정이 필요하지 않아요"
        >
          📚 NCS 과정이 필요하지 않아요
        </button>

        <button
          type="button"
          data-reason="다른 일정 또는 취업 준비가 있어요"
        >
          💼 다른 일정 또는 취업 준비가 있어요
        </button>

        <button
          type="button"
          id="otherButton"
        >
          ✏️ 기타
        </button>

      </div>


      <!-- 기타 직접 입력 -->
      <div
        class="other-box"
        id="otherBox"
      >

        <textarea
          id="otherReason"
          placeholder="참여가 어려운 이유를 간단히 적어주세요."
        ></textarea>

        <button
          type="button"
          class="other-submit"
          id="otherSubmit"
        >
          기타 사유 제출하기
        </button>

      </div>

    </section>


    <!-- 완료 메시지 -->
    <div id="message">
      응답 완료! 감사합니다 🙌
    </div>


    <!-- 참여 응답 전송 -->
    <form
      id="yesForm"
      action="https://script.google.com/macros/s/AKfycbyc3EoRU_u1rxLSyFYeUYXHbks2y-hDP5YPyRPkTeC2DFZGAFjV5OVudG4euwcjXb8/exec"
      method="POST"
      target="hiddenFrame"
      style="display:none;"
    >
      <input
        type="hidden"
        name="answer"
        value="참여하고 싶어요"
      >

      <input
        type="hidden"
        name="reason"
        value=""
      >
    </form>


    <!-- 불참 응답 전송 -->
    <form
      id="noForm"
      action="https://script.google.com/macros/s/AKfycbyc3EoRU_u1rxLSyFYeUYXHbks2y-hDP5YPyRPkTeC2DFZGAFjV5OVudG4euwcjXb8/exec"
      method="POST"
      target="hiddenFrame"
      style="display:none;"
    >
      <input
        type="hidden"
        name="answer"
        value="참여가 어려워요"
      >

      <input
        type="hidden"
        name="reason"
        id="reasonInput"
        value=""
      >
    </form>


    <!-- Apps Script 결과는 숨김 -->
    <iframe
      name="hiddenFrame"
      style="display:none;"
    ></iframe>

  </main>


  <script>

    const page =
      document.getElementById("page");

    const yesButton =
      document.getElementById("yesButton");

    const noButton =
      document.getElementById("noButton");

    const yesForm =
      document.getElementById("yesForm");

    const noForm =
      document.getElementById("noForm");

    const reasonBox =
      document.getElementById("reasonBox");

    const reasonInput =
      document.getElementById("reasonInput");

    const otherButton =
      document.getElementById("otherButton");

    const otherBox =
      document.getElementById("otherBox");

    const otherReason =
      document.getElementById("otherReason");

    const otherSubmit =
      document.getElementById("otherSubmit");

    const message =
      document.getElementById("message");


    function completeVote() {

      localStorage.setItem(
        "ncsSurvey2026",
        "done"
      );

      page.classList.add("submitted");

      reasonBox.style.display = "none";
      message.style.display = "block";

      message.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    }


    /* 참여할래요 */
    yesButton.addEventListener(
      "click",
      () => {

        yesForm.submit();

        completeVote();

      }
    );


    /* 참여가 어려워요 */
    noButton.addEventListener(
      "click",
      () => {

        reasonBox.style.display = "block";
        otherBox.style.display = "none";

        reasonBox.scrollIntoView({
          behavior: "smooth",
          block: "nearest"
        });

      }
    );


    /* 일반 불참 사유 */
    document
      .querySelectorAll("[data-reason]")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            reasonInput.value =
              button.dataset.reason;

            noForm.submit();

            completeVote();

          }
        );

      });


    /* 기타 클릭 */
    otherButton.addEventListener(
      "click",
      () => {

        otherBox.style.display = "block";

        otherReason.focus();

        otherBox.scrollIntoView({
          behavior: "smooth",
          block: "nearest"
        });

      }
    );


    /* 기타 제출 */
    otherSubmit.addEventListener(
      "click",
      () => {

        const text =
          otherReason.value.trim();

        if (!text) {

          alert(
            "기타 사유를 입력해주세요."
          );

          otherReason.focus();

          return;
        }

        reasonInput.value =
          "기타: " + text;

        noForm.submit();

        completeVote();

      }
    );


    /* 이미 응답한 브라우저 */
    if (
      localStorage.getItem(
        "ncsSurvey2026"
      )
    ) {

      page.classList.add("submitted");

      message.style.display = "block";

    }

  </script>

</body>
</html>
