    * {

    html,

      display: grid;
      grid-template-columns: 1fr 1fr;

      margin-top: 12px;
    }

    .btn {
      min-height: 58px;

      align-items: center;
      justify-content: center;

      padding: 12px 10px;
      border-radius: 16px;

      text-align: center;
      text-decoration: none;

      font-size: 15px;
      font-weight: 900;

      word-break: keep-all;
      transition: transform .15s ease;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn:focus-visible {
      outline: 3px solid #172c67;
      outline-offset: 3px;
    }

    .home {
      background: #1453bf;
      color: #ffffff;

      box-shadow:
        0 6px 16px rgba(20, 83, 191, .18);
    }

    /* 하단 안내 */

    .note {
      margin: 13px 4px 0;

      color: #52698b;
      font-size: 12px;
      line-height: 1.6;

      text-align: center;
    }

    @media (max-width: 360px) {
      .btn {
        font-size: 13px;
        padding: 9px 6px;
      }
    }
