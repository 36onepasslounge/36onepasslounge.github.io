<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>졸특 PICK 자동 홍보</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#eef4fb;color:#17365e}
.wrap{max-width:780px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#fff8ee,#f4f1ff 45%,#effff8);border-radius:30px;padding:18px 22px;box-shadow:0 12px 30px #294b7018;position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;opacity:.55}.hero:before{width:220px;height:220px;background:#ffe4ef;left:-90px;top:-80px}.hero:after{width:220px;height:220px;background:#dff8ef;right:-90px;top:-80px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:18px;position:relative;z-index:2}.brand img.logo{max-width:310px;height:auto}.pick{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(180deg,#0d53a7,#0a2f72);border:4px solid #2388ff;color:#fff;font-weight:900;border-radius:24px;padding:9px 18px;font-size:29px;box-shadow:inset 0 0 0 2px #062d65,0 4px 0 #051e4e}.pick b{background:linear-gradient(180deg,#ffd92f,#ff9e22,#ff4c8f,#7454ff);-webkit-background-clip:text;color:transparent}
.mascots{display:flex;justify-content:space-between;align-items:flex-end;margin-top:4px;padding:0 24px;position:relative;z-index:1}.mascots img{height:130px;width:auto;filter:drop-shadow(0 5px 8px #294b7030)}
h1{text-align:center;font-size:34px;margin:-6px 0 4px;letter-spacing:-1.5px;position:relative;z-index:2}.sub{text-align:center;font-size:17px;font-weight:800;background:#c9f6e4;border-radius:999px;padding:9px 18px;margin:8px auto 4px;max-width:560px;color:#133c63;position:relative;z-index:2}
.list{display:grid;gap:14px;margin-top:14px}.card{background:white;border-radius:27px;padding:20px;border:4px solid #dfe7f2;box-shadow:0 8px 18px #31557a14;position:relative;overflow:hidden}.card.purple{background:linear-gradient(180deg,#fff,#faf6ff);border-color:#bea3ff}.card.pink{background:linear-gradient(180deg,#fff,#fff6fa);border-color:#ff9fc3}
.ribbon{display:inline-block;border-radius:16px;padding:9px 18px;font-size:24px;font-weight:900;color:#fff;margin-bottom:10px;box-shadow:0 4px 10px #0001}.purple .ribbon{background:linear-gradient(90deg,#7c4bd9,#5d2eb9)}.pink .ribbon{background:linear-gradient(90deg,#ea376e,#cf2158)}
.card h2{font-size:27px;margin:0 0 12px;letter-spacing:-1px}.grid{display:grid;gap:8px}.row{background:#fff;border-radius:999px;padding:10px 14px;font-size:15px;line-height:1.45;border:1px solid #e7ecf3}.row b{display:inline-block;min-width:64px}.benefit{margin-top:10px;padding:11px 13px;border-radius:999px;font-size:14px;font-weight:900;background:#d8f7e9;text-align:center}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.btn{display:block;text-align:center;text-decoration:none;border-radius:999px;padding:12px;font-weight:900}.info{background:#edf3ff;color:#315c93}.apply{background:#17365e;color:#fff}.footer{text-align:center;margin:16px 0 4px;color:#71839b;font-size:12px}
#promo{width:1080px;padding:34px;background:linear-gradient(135deg,#fff6ea,#eff8ff 52%,#fff2f8);position:absolute;left:-99999px;top:0}
#promo .inner{background:transparent;border-radius:34px;padding:8px}.promoTitle{font-size:46px;text-align:center;font-weight:900;margin:6px 0 4px}.promoSub{text-align:center;background:#bdf4df;border-radius:999px;padding:10px 20px;font-size:24px;font-weight:900;margin:0 auto 18px;max-width:700px}
#promo .brand img.logo{max-width:360px}#promo .pick{font-size:36px}#promo .mascots img{height:170px}#promo .list{grid-template-columns:1fr 1fr;gap:16px}#promo .card{padding:24px;min-height:560px}#promo .ribbon{font-size:33px}#promo .card h2{font-size:31px}#promo .row{font-size:19px;padding:13px 15px;border-radius:18px}#promo .benefit{font-size:20px;border-radius:18px;padding:14px}
#og{width:1200px;height:630px;padding:24px;background:linear-gradient(135deg,#fff5e8,#eff8ff 48%,#fff0f6);position:absolute;left:-99999px;top:0;overflow:hidden}
#og .inner{height:582px;background:transparent}.ogtop{display:flex;justify-content:space-between;align-items:center}.ogtop img{max-height:72px;max-width:360px}.ogTitle{font-size:48px;text-align:center;font-weight:900;margin:6px 0}.ogSub{text-align:center;background:#bdf4df;border-radius:999px;padding:8px 18px;font-size:24px;font-weight:900;margin:0 auto 10px;max-width:720px}.ogcards{display:grid;grid-template-columns:1fr 1fr;gap:18px}.ogcards .card{height:330px;padding:18px}.ogcards .ribbon{font-size:28px}.ogcards h2{font-size:24px}.ogcards .row{font-size:14px;padding:8px 10px}.ogcards .benefit{font-size:14px;padding:8px 10px}
@media(max-width:520px){.actions{grid-template-columns:1fr}.brand{flex-direction:column}.brand img.logo{max-width:250px}}
</style></head><body>
<div class="wrap" id="app"></div><div id="promo"></div><div id="og"></div>
<script>
const DATA=__DATA__;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function card(p,compact=false){return '<section class="card '+esc(p.accent)+'"><div class="ribbon">'+esc(p.name)+'</div><div class="grid"><div class="row"><b>일정</b>'+esc(p.period)+'</div><div class="row"><b>방식</b>'+esc(p.method)+'</div><div class="row"><b>대상</b>'+esc(p.target)+'</div>'+(!compact?'<div class="row"><b>내용</b>'+esc(p.content)+'</div>':'')+'</div><div class="benefit">'+esc(p.benefit)+'</div>'+(!compact?'<div class="actions"><a class="btn info" href="'+esc(p.info_url)+'">상세 안내</a><a class="btn apply" href="'+esc(p.apply_url)+'">바로 신청</a></div>':'')+'</section>'}
function head(){return '<div class="brand"><img class="logo" src="../../syu-logo.png"><div class="pick">졸<b>특</b> PICK</div></div><div class="mascots"><img src="../../suya.png"><img src="../../suho.png"></div><h1>'+esc(DATA.title)+'</h1><div class="sub">'+esc(DATA.subtitle)+'</div>'}
document.getElementById('app').innerHTML='<div class="hero">'+head()+'</div><div class="list">'+DATA.programs.map(p=>card(p)).join('')+'</div><div class="footer">삼육대학교 대학일자리본부 · 졸업생특화프로그램</div>';
document.getElementById('promo').innerHTML='<div class="inner"><div class="brand"><img class="logo" src="../../syu-logo.png"><div class="pick">졸<b>특</b> PICK</div></div><div class="mascots"><img src="../../suya.png"><img src="../../suho.png"></div><div class="promoTitle">'+esc(DATA.title)+'</div><div class="promoSub">'+esc(DATA.subtitle)+'</div><div class="list">'+DATA.programs.slice(0,2).map(p=>card(p,true)).join('')+'</div><div class="footer">ONE-PASS LOUNGE · 이미지 클릭 → 통합 안내페이지</div></div>';
document.getElementById('og').innerHTML='<div class="inner"><div class="ogtop"><img src="../../syu-logo.png"><div class="pick">졸<b>특</b> PICK</div></div><div class="ogTitle">'+esc(DATA.title)+'</div><div class="ogSub">'+esc(DATA.subtitle)+'</div><div class="ogcards">'+DATA.programs.slice(0,2).map(p=>card(p,true)).join('')+'</div></div>';
</script></body></html>
