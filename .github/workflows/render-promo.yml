name: Render promo assets
on:
  push:
    paths:
      - 'automation/data.json'
      - 'automation/template.html'
      - 'automation/render.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y && npm install playwright
      - run: npx playwright install --with-deps chromium
      - run: node automation/render.mjs
      - name: Commit rendered promo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pick/auto-promo/
          git diff --cached --quiet || git commit -m "Auto-render promo page and images"
          git push
